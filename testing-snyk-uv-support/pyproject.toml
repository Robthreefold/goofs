[project]
name = "snyk-sync-test-uv"
version = "0.1.0"
description = "Test fixture for Snyk Repo Content Sync: pyproject.toml detection without a lockfile"
requires-python = ">=3.11"
dependencies = [
    "requests==2.31.0",
    "flask==2.3.3",
    "jinja2==3.1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
